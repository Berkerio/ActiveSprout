<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Percorso</title>
<!-- CSS -->
<link rel="stylesheet" href="map.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-esri/dist/leaflet-routing-esri.css" />

<!-- JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet"></script>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
<script src="https://unpkg.com/leaflet-routing-esri/dist/leaflet-routing-esri.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/leaflet-geosearch"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="title">Simulazione Percorso</h1>
      <div class="details">
        <div class="info">
          <div class="line1">
            <div class="section">
              <p><strong>Modalità</strong></p>
              <p class="highlight">Camminata</p>
            </div>
            <div class="section">
              <p><strong>Calorie bruciate</strong></p>
              <p class="calories">0 cal</p>
            </div>
          </div>
          <div class="line2">
            <div class="section">
              <p><strong>Lunghezza stimata</strong></p>
              <p class="length">0 km</p>
            </div>
            <div class="section">
              <p><strong>Durata</strong></p>
              <p class="time">0h 0m 0s</p>
            </div>
          </div>
        </div>
        <div class="popup-overlay"></div>
        <div class="stage-popup">
          <div class="popup-header"></div>
          <div class="popup-content"></div>
        </div>
        <div class="steps">
          <p class="Dec"><strong>Informazioni sulle tappe</strong></p>
          <div class="step-bar">
            <button class="step" onclick="changeDescription(0)">Inizio</button>
            <button class="step" onclick="changeDescription(1)">Prima Tappa</button>
            <button class="step" onclick="changeDescription(2)">Seconda Tappa</button>
            <button class="step" onclick="changeDescription(3)">Fine</button>
          </div>
        </div>
        <div class="description">
          <p class="Dec"><strong>Descrizione dell'attività</strong></p>
          <!-- Area di testo per la descrizione dell'attività -->
          <textarea id="description" placeholder="Descrivi l'attività per ogni tappa"></textarea>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn modify exit-btn">Esci</button>
      <button class="btn save">Avvia</button>
    </div>
    <div id="map"></div>
  </div>
  <script src="map.js"></script>
</body>
</html>
