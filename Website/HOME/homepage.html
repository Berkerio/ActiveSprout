<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Dashboard Fitness</title>
    <link rel="stylesheet" href="homepage.css" />
    <link rel="stylesheet" href="../Font/font.css">
    <link rel="stylesheet" href="../Assets/loading.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.6/lottie.min.js"></script>
  </head>
  <body>
    <!-- Loading Overlay -->
    <div class="loading-overlay">
      <div id="lottie-loading" class="loading-logo"></div>
    </div>
    <div class="main-version">
      <div class="background" aria-hidden="true">
        <img
          loading="lazy"
          src="../Assets/CloudsBackground.png"
          class="background-image"
          alt=""
        />
        <img
          loading="lazy"
          src="../Assets/Logo.png"
          class="background-image-2"
          alt=""
        />
      </div>

      <header class="header">
        <div class="profile-section">
          <img
            loading="lazy"
            src="https://cdn.builder.io/api/v1/image/assets/aec65175c00543da9e7ba875bbd863d4/8afa3a929366ebf21b416f8d201fd50313c6eafd3b53bf28f302a100a9fe0e8d"
            class="profile-image"
            alt="Profile picture"
          />
          <div class="user-info">
            <p class="points-text">Punti accumulati</p>
            <p class="username-text">Nome utente</p>
          </div>
        </div>

        <div class="welcome-section">
          <h1 class="welcome-title">BENVENUTO/a</h1>
          <p class="welcome-description">
            Benvenuto! Esplora il tuo percorso verso il fitness. Passa sopra i
            bottoni per scoprire ulteriori dettagli e inizia subito!
          </p>
        </div>
      </header>

      <main class="main-content">
        <div class="create-path-section">
          <div class="lock-icon-wrapper">
            <img
              src="../Assets/Lock.png"
              class="lock-icon"
              alt="Lock icon"
            />
          </div>
          <button
            class="create-path-btn"
            aria-label="Crea il tuo percorso - Funzionalità bloccata"
            aria-disabled="true"
          >
            CREA IL TUO PERCORSO!
          </button>
        </div>

        <div class="chosen-path-section">
          <div class="path-background" aria-hidden="true"></div>
            <a href="../percorsipage/percorsi.html">
              <button
          class="view-paths-btn"
          aria-label="Visualizza tutti i percorsi"
              >
          VIsualizza tutti i percorsi
              </button>
            </a>
        </div>

        <div class="dashboard-section">
          <div class="lock-icon-wrapper">
            <img
              src="../Assets/Lock.png"
              class="lock-icon"
              alt="Lock icon"
            />
          </div>
          <button
            class="activities-btn"
            aria-label="Le tue attività - Funzionalità bloccata"
            aria-disabled="true"
          >
            LE TUE attività
          </button>
        </div>
      </main>
    </div>
    <script src="../Assets/loading.js"></script>
  </body>
</html>
