<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Percorsi - Esplora i Tuoi Itinerari</title>
    <link rel="stylesheet" href="/Font/font.css">
    <link rel="stylesheet" href="percorsi.css" />
    <link rel="stylesheet" href="/Assets/loading.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.6/lottie.min.js"></script>
  </head>
  <body>
      <!-- Loading Overlay -->
      <div class="loading-overlay">
        <div id="lottie-loading" class="loading-logo"></div>
      </div>
    <main class="main-container">
      <header class="header">
        <h1 class="title">PERCORSI</h1>
        <h2 class="subtitle">I TUOI PERCORSI</h2>
      </header>

      <div class="routes-container">
        <button
          class="route-card"
          onclick="window.location.href='/map trial/mappa.html'"
          aria-label="Vai al percorso Simulazione, durata 2 ore e 40 minuti"
        >
          <div class="route-card-content">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/198f25a015066d39975e9d245f1fd287a338e132"
              alt="Paesaggio montano con lago riflettente"
              loading="lazy"
              class="route-image"
            />
            <div class="route-info">
              <h3 class="route-title">Simulazione</h3>
              <p class="route-time">2 h 40 m</p>
            </div>
          </div>
        </button>

        <button
          class="route-card"
          onclick="window.location.href='/percorsi/percorso-reale'"
          aria-label="Vai al percorso reale, durata 1 ora e 50 minuti"
        >
          <div class="route-card-content">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/198f25a015066d39975e9d245f1fd287a338e132"
              alt="Paesaggio montano con lago riflettente"
              loading="lazy"
              class="route-image"
            />
            <div class="route-info">
              <h3 class="route-title">Percorso reale</h3>
              <p class="route-time">1 h 50 m</p>
            </div>
          </div>
        </button>

        <button
          class="route-card"
          onclick="window.location.href='/percorsi/altro-reale'"
          aria-label="Vai al percorso Altro reale, durata 45 minuti"
        >
          <div class="route-card-content">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/198f25a015066d39975e9d245f1fd287a338e132"
              alt="Paesaggio montano con lago riflettente"
              loading="lazy"
              class="route-image"
            />
            <div class="route-info">
              <h3 class="route-title">Altro reale</h3>
              <p class="route-time">0h 45m</p>
            </div>
          </div>
        </button>
      </div>

      <section class="recent-routes-section">
        <h2 class="recent-routes-title">PERCORSI RECENTI</h2>
        <div class="recent-routes-container">
          <button
            class="recent-route-card"
            onclick="window.location.href='/percorsi/recenti/1'"
            aria-label="Vai al Percorso 1"
          >
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/e12b2b5bddaee927bde1be9bb047143325115416"
              alt="Paesaggio montano"
              loading="lazy"
              class="recent-route-image"
            />
            <h3 class="recent-route-name">Percorso 1</h3>
          </button>

          <button
            class="recent-route-card"
            onclick="window.location.href='/percorsi/recenti/2'"
            aria-label="Vai al Percorso 2"
          >
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/1b39e8769194bb692793d0257ca654cb54140ae2"
              alt="Sentiero alberato"
              loading="lazy"
              class="recent-route-image"
            />
            <h3 class="recent-route-name">Percorso 2</h3>
          </button>

          <button
            class="recent-route-card"
            onclick="window.location.href='/percorsi/recenti/3'"
            aria-label="Vai al Percorso 3"
          >
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/f8b03b7a17bdf15f076d0c1d211189d3c903d266"
              alt="Tramonto sul lago"
              loading="lazy"
              class="recent-route-image"
            />
            <h3 class="recent-route-name">Percorso 3</h3>
          </button>
        </div>
      </section>
    </main>
    <script src="/Assets/loading.js"></script>
  </body>
</html>
