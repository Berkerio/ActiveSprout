<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <style>
        #map { height: 100vh; }
        .control-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="control-panel">
        <input type="text" id="lat" placeholder="Latitudine" style="width: 80px;" />
        <input type="text" id="lng" placeholder="Longitudine" style="width: 80px;" />
        <button onclick="addWaypoint()">Aggiungi Punto</button>
    </div>

    <script>
        // Inizializza la mappa centrata su Roma
        var map = L.map('map').setView([41.9028, 12.4964], 13);

        // Aggiunge il layer della mappa
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Array per memorizzare i waypoints
        var waypoints = [
            L.latLng(41.9028, 12.4964), // Partenza (Roma)
            L.latLng(41.8902, 12.4922)  // Arrivo (Colosseo)
        ];

        // Crea il controllo del percorso
        var routingControl = L.Routing.control({
            waypoints: waypoints,
            routeWhileDragging: true,
            showAlternatives: true,  // Mostra percorsi alternativi
            altLineOptions: {
                styles: [{ color: 'gray', opacity: 0.5, weight: 6 }]
            }
        }).addTo(map);

        // Aggiungi un punto quando l'utente clicca sulla mappa
        map.on('click', function(e) {
            var newPoint = L.latLng(e.latlng.lat, e.latlng.lng);
            waypoints.splice(waypoints.length - 1, 0, newPoint); // Inserisce prima dell'arrivo
            routingControl.setWaypoints(waypoints);
        });

        // Funzione per aggiungere waypoint manualmente
        function addWaypoint() {
            var lat = parseFloat(document.getElementById('lat').value);
            var lng = parseFloat(document.getElementById('lng').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                var newPoint = L.latLng(lat, lng);
                waypoints.splice(waypoints.length - 1, 0, newPoint);
                routingControl.setWaypoints(waypoints);
            } else {
                alert("Inserisci coordinate valide!");
            }
        }
    </script>
</body>
</html>
