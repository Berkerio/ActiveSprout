<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dati Fisici</title>
    <link rel="stylesheet" href="dati-fisici.css">
    <link rel="stylesheet" href="/Font/font.css">
    <link rel="stylesheet" href="../Assets/loading.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.6/lottie.min.js"></script>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay">
        <div id="lottie-loading" class="loading-logo"></div>
        <div class="loading-text">Caricamento in corso...</div>
    </div>

    <a href="../Manuale/Manuale.html" class="help-button">?</a>

    <main class="dati-fisici">
      <div class="content-wrapper">
        <header class="form-header">
          <h1 class="title">DATI fisici</h1>
          <p class="subtitle">Inserisci i tuoi daTI FISICI</p>
        </header>

        <form class="physical-data-form" id="physicalDataForm">
          <div class="input-group">
            <label class="input-label" for="height">ALTEZZA</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="height"
                class="form-input"
                placeholder="inserisci la tua altezza"
                aria-label="Inserisci la tua altezza"
              />
            </div>
          </div>

          <div class="input-group">
            <label class="input-label" for="weight">PESO</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="weight"
                class="form-input"
                placeholder="inserisci il tuo peso"
                aria-label="Inserisci il tuo peso"
              />
            </div>
          </div>

          <div class="input-group">
            <label class="input-label" for="age">ANNI</label>
            <div class="input-wrapper">
              <input
                type="text"
                id="age"
                class="form-input"
                placeholder="inserisci la tua età"
                aria-label="Inserisci la tua età"
              />
            </div>
          </div>
            <div class="input-group">
            <button type="submit" class="submit-button" formaction="Profile.html">Invia</button>
            </div>
            <div class="input-group">
            <button type="button" class="back-button" onclick="window.history.back();">Indietro</button>
            </div>
        </form>
      </div>

      <div class="image-container">
        <img
          loading="lazy"
          src="https://cdn.builder.io/api/v1/image/assets/aec65175c00543da9e7ba875bbd863d4/84cc93ae1baa0eb2fd6d00672129e96d8713593f017fb989312e4b62b0894db2"
          class="background-image"
          alt="Background Image"
          aria-hidden="true"
        />
      </div>
    <script>
      document.getElementById('physicalDataForm').addEventListener('submit', function(event) {
      event.preventDefault();
      
      const height = document.getElementById('height').value;
      const weight = document.getElementById('weight').value;
      const age = document.getElementById('age').value;

      localStorage.setItem('height', height);
      localStorage.setItem('weight', weight);
      localStorage.setItem('age', age);

      // Redirect to Profile.html
      window.location.href = '../Profile/Profile.html';
      });

      // Pre-fill form if data exists in local storage
      window.addEventListener('load', function() {
      if (localStorage.getItem('height')) {
        document.getElementById('height').value = localStorage.getItem('height');
      }
      if (localStorage.getItem('weight')) {
        document.getElementById('weight').value = localStorage.getItem('weight');
      }
      if (localStorage.getItem('age')) {
        document.getElementById('age').value = localStorage.getItem('age');
      }
      });
    </script>
    <script src="../Assets/loading.js"></script>
  </body>
  </html>
